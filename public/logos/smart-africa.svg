<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 80" width="180" height="80">
  <!-- Pixelated Africa continent -->
  <g transform="translate(2,4)">
    <!-- Row 0 -->
    <rect x="18" y="0"  width="5" height="5" fill="#1B3A6B"/>
    <rect x="24" y="0"  width="5" height="5" fill="#00B0BE"/>
    <rect x="30" y="0"  width="5" height="5" fill="#1B3A6B"/>
    <rect x="36" y="0"  width="5" height="5" fill="#00B0BE"/>
    <!-- Row 1 -->
    <rect x="12" y="6"  width="5" height="5" fill="#00B0BE"/>
    <rect x="18" y="6"  width="5" height="5" fill="#1B3A6B"/>
    <rect x="24" y="6"  width="5" height="5" fill="#00B0BE"/>
    <rect x="30" y="6"  width="5" height="5" fill="#1B3A6B"/>
    <rect x="36" y="6"  width="5" height="5" fill="#1B3A6B"/>
    <rect x="42" y="6"  width="5" height="5" fill="#00A651"/>
    <!-- Row 2 -->
    <rect x="6"  y="12" width="5" height="5" fill="#1B3A6B"/>
    <rect x="12" y="12" width="5" height="5" fill="#00B0BE"/>
    <rect x="18" y="12" width="5" height="5" fill="#1B3A6B"/>
    <rect x="24" y="12" width="5" height="5" fill="#00B0BE"/>
    <rect x="30" y="12" width="5" height="5" fill="#1B3A6B"/>
    <rect x="36" y="12" width="5" height="5" fill="#00B0BE"/>
    <rect x="42" y="12" width="5" height="5" fill="#1B3A6B"/>
    <!-- Row 3 – horn of africa -->
    <rect x="6"  y="18" width="5" height="5" fill="#00B0BE"/>
    <rect x="12" y="18" width="5" height="5" fill="#1B3A6B"/>
    <rect x="18" y="18" width="5" height="5" fill="#00B0BE"/>
    <rect x="24" y="18" width="5" height="5" fill="#1B3A6B"/>
    <rect x="30" y="18" width="5" height="5" fill="#00B0BE"/>
    <rect x="36" y="18" width="5" height="5" fill="#1B3A6B"/>
    <rect x="42" y="18" width="5" height="5" fill="#00B0BE"/>
    <rect x="48" y="18" width="5" height="5" fill="#1B3A6B"/>
    <!-- Row 4 -->
    <rect x="6"  y="24" width="5" height="5" fill="#1B3A6B"/>
    <rect x="12" y="24" width="5" height="5" fill="#00B0BE"/>
    <rect x="18" y="24" width="5" height="5" fill="#1B3A6B"/>
    <rect x="24" y="24" width="5" height="5" fill="#00A651"/>
    <rect x="30" y="24" width="5" height="5" fill="#1B3A6B"/>
    <rect x="36" y="24" width="5" height="5" fill="#00B0BE"/>
    <rect x="42" y="24" width="5" height="5" fill="#1B3A6B"/>
    <!-- Row 5 -->
    <rect x="6"  y="30" width="5" height="5" fill="#00B0BE"/>
    <rect x="12" y="30" width="5" height="5" fill="#1B3A6B"/>
    <rect x="18" y="30" width="5" height="5" fill="#00B0BE"/>
    <rect x="24" y="30" width="5" height="5" fill="#1B3A6B"/>
    <rect x="30" y="30" width="5" height="5" fill="#00B0BE"/>
    <rect x="36" y="30" width="5" height="5" fill="#1B3A6B"/>
    <!-- Row 6 -->
    <rect x="12" y="36" width="5" height="5" fill="#1B3A6B"/>
    <rect x="18" y="36" width="5" height="5" fill="#00B0BE"/>
    <rect x="24" y="36" width="5" height="5" fill="#1B3A6B"/>
