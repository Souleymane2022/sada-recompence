    <rect x="18" y="48" width="5" height="5" fill="#1B3A6B"/>
    <!-- Row 9 (cape) -->
    <rect x="18" y="54" width="5" height="5" fill="#00B0BE"/>
    <rect x="24" y="54" width="5" height="5" fill="#1B3A6B"/>
