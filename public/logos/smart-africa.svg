  <!-- "smart africa" text -->
  <text x="62" y="26" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#1B3A6B" letter-spacing="0">smart</text>
  <text x="62" y="46" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#1B3A6B" letter-spacing="0">africa</text>

  <!-- Tagline -->
  <text x="62" y="58" font-family="Arial, Helvetica, sans-serif" font-size="6" fill="#888888" letter-spacing="0.5">CONNECT. INNOVATE. TRANSFORM.</text>
