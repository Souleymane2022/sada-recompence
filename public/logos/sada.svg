<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70">
  <!-- Background badge shape -->
  <rect x="2" y="4" width="62" height="62" rx="6" fill="#0D2E5A"/>

  <!-- SADA acronym -->
  <text x="33" y="32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#C8A84B" text-anchor="middle" letter-spacing="2">SADA</text>

  <!-- Decorative line in badge -->
  <line x1="10" y1="36" x2="56" y2="36" stroke="#C8A84B" stroke-width="1" opacity="0.7"/>

  <!-- Stars -->
  <text x="33" y="52" font-family="Arial" font-size="9" fill="#C8A84B" text-anchor="middle" letter-spacing="3">★ ★ ★</text>

  <!-- Full name -->
  <text x="74" y="22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0D2E5A">Smart Africa</text>
  <text x="74" y="37" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0D2E5A">Digital Academy</text>

  <!-- Tagline -->
  <text x="74" y="52" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#555555" letter-spacing="0.3">Building Africa's Digital Future</text>

  <!-- Decorative line -->
  <line x1="74" y1="41" x2="218" y2="41" stroke="#C8A84B" stroke-width="1" opacity="0.4"/>
</svg>
